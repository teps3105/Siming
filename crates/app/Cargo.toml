[package]
name = "siming"
description = "GDD 6.4：呈現層（Bevy 0.16 + bevy_egui 0.34）。"
version.workspace = true
edition.workspace = true
license.workspace = true

# GDD 1.7：執行檔以 Siming 為名（Windows 為 Siming.exe）；套件名維持專案代號。
[[bin]]
name = "Siming"
path = "src/main.rs"

[dependencies]
siming-sim.workspace = true
serde.workspace = true
serde_json.workspace = true
bevy_egui = "0.34.1"

[dependencies.bevy]
version = "0.16.1"
default-features = false
features = [
  "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_asset",
  "bevy_window", "bevy_log", "bevy_state", "png", "tonemapping_luts", "std",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.bevy]
version = "0.16.1"
default-features = false
features = ["multi_threaded", "x11", "bevy_gilrs"]

[target.'cfg(target_arch = "wasm32")'.dependencies.bevy]
version = "0.16.1"
default-features = false
features = ["webgl2"]
