<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>司命</title>
<style>
  html, body { margin: 0; height: 100%; background: #EDE4CF; overflow: hidden; }
  #bevy { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 24px serif; color: #5a4a32; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bevy"></canvas>
<div id="loading">載入中…</div>
<script type="module">
  import init from "./Siming.js";
  try {
    await init();
  } catch (e) {
    // Bevy 以例外跳出事件迴圈屬正常；其他錯誤顯示於畫面
    if (!String(e).includes("Using exceptions for control flow")) {
      document.getElementById("loading").textContent = "載入失敗：" + e;
      throw e;
    }
  }
  document.getElementById("loading").remove();
</script>
</body>
</html>
