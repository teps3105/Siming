[workspace]
members = ["crates/sim", "crates/cli", "crates/gdext"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
siming-sim = { path = "crates/sim" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
rustc-hash = "2"
smallvec = { version = "1", features = ["serde"] }

[profile.dev]
opt-level = 1
# 共用磁碟有限：開發建置不產生完整除錯資訊（只保留行號）。
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
