[workspace]
members = ["crates/sim", "crates/app", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
siming-sim = { path = "crates/sim" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
rustc-hash = "2"
smallvec = { version = "1", features = ["serde"] }

[profile.dev]
opt-level = 1
# 共用磁碟有限：開發建置不產生完整除錯資訊（只保留行號）。
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

# 網頁版（tools/build_web.sh）：以體積為優先；原生版仍使用 release。
[profile.release-web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
